# Grafana dashboard provisioning — load every JSON dashboard from /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: "NBA Ops dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
